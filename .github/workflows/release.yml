
name: Build and Release Om-LifeOS (Windows EXE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v4.8.4)"
        required: false
        default: "v4.8.4"
        type: string

permissions:
  contents: write

concurrency:
  group: om-lifeos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 4. Verify project structure
      - name: Verify project files
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          if (!(Test-Path "package.json")) {
            throw "package.json not found in repository root."
          }

          if (!(Test-Path "index.html")) {
            throw "index.html not found in repository root."
          }

          if (!(Test-Path "src/main.tsx")) {
            throw "src/main.tsx not found in repository root."
          }

          if (!(Test-Path "src-tauri")) {
            throw "src-tauri directory not found."
          }

          Write-Host "Project files verified."

      # 5. Install dependencies
      - name: Install npm dependencies
        shell: pwsh
        run: |
          npm cache clean --force
          npm install --legacy-peer-deps --no-audit --no-fund

      # 6. Repair missing Windows Rollup binding
      - name: Ensure Rollup Windows native binding
        shell: pwsh
        run: |
          $rollupVersion = node -p "require('rollup/package.json').version"

          if (!$rollupVersion) {
            throw "Could not determine the installed Rollup version."
          }

          Write-Host "Installed Rollup version: $rollupVersion"

          npm install --no-save --package-lock=false `
            --legacy-peer-deps --no-audit --no-fund `
            "@rollup/rollup-win32-x64-msvc@$rollupVersion"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install the Rollup Windows native binding."
          }

          node -e "require('@rollup/rollup-win32-x64-msvc'); console.log('Rollup native binding loaded successfully.')"

      # 7. Verify frontend files and build script
      - name: Verify frontend configuration
        shell: pwsh
        run: |
          Write-Host "Node version:"
          node --version

          Write-Host "NPM version:"
          npm --version

          Write-Host "Build script:"
          npm pkg get scripts.build

          Write-Host "Frontend entry:"
          Get-Content "src/main.tsx" -TotalCount 20

      # 8. Build Vite frontend
      - name: Build Web Frontend
        shell: pwsh
        run: |
          npm run build

          if ($LASTEXITCODE -ne 0) {
            throw "Vite frontend build failed."
          }

          if (!(Test-Path "dist/index.html")) {
            throw "Frontend build did not generate dist/index.html."
          }

          Write-Host "Frontend build succeeded."

      # 9. Cache Rust dependencies
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      # 10. Build Tauri Windows installer
      - name: Build Windows Application
        shell: pwsh
        run: |
          npx tauri build --ci

          if ($LASTEXITCODE -ne 0) {
            throw "Tauri Windows build failed."
          }

      # 11. Verify installer output
      - name: Verify Windows Installer
        shell: pwsh
        run: |
          $directories = @(
            "src-tauri/target/release/bundle/nsis",
            "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          )

          $found = @(
            foreach ($directory in $directories) {
              if (Test-Path $directory) {
                Get-ChildItem $directory -Filter "*.exe" -File
              }
            }
          )

          $found = @($found | Sort-Object FullName -Unique)

          if ($found.Count -eq 0) {
            throw "No Windows EXE installer was generated."
          }

          $found | ForEach-Object {
            Write-Host "Installer: $($_.FullName)"
          }

      # 12. Upload installer
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Om-LifeOS-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # 13. Publish tagged GitHub releases
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
