
name: Build and Release Om-LifeOS (Windows EXE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v4.8.4)"
        required: false
        default: "v4.8.4"
        type: string

permissions:
  contents: write

concurrency:
  group: om-lifeos-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configure Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Verify repository structure
      - name: Verify project files
        shell: pwsh
        run: |
          Write-Host "Repository: $env:GITHUB_WORKSPACE"
          Write-Host "Git commit: $env:GITHUB_SHA"

          if (!(Test-Path "package.json")) {
            throw "package.json is missing from the repository root."
          }

          if (!(Test-Path "index.html")) {
            throw "index.html is missing from the repository root."
          }

          if (!(Test-Path "src/main.tsx")) {
            throw "src/main.tsx is missing from the repository root."
          }

          if (!(Test-Path "src-tauri/tauri.conf.json") -and
              !(Test-Path "src-tauri/tauri.conf.json5") -and
              !(Test-Path "src-tauri/tauri.conf.jsonc")) {
            throw "Tauri configuration file was not found."
          }

          Write-Host "Frontend and Tauri configuration files found."

      # 4. Setup Rust
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 5. Cache Rust compilation
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      # 6. Install JavaScript dependencies
      - name: Install dependencies
        shell: pwsh
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund

      # 7. Verify installed tools and scripts
      - name: Verify build configuration
        shell: pwsh
        run: |
          node --version
          npm --version
          npm run

          if (!(Test-Path "node_modules")) {
            throw "Node dependencies were not installed."
          }

      # 8. Build frontend
      - name: Build Web Frontend
        shell: pwsh
        run: |
          Write-Host "Building Vite frontend..."
          npm run build

          if (!(Test-Path "dist/index.html")) {
            throw "Vite build did not generate dist/index.html. Check the Vite output directory."
          }

          Write-Host "Frontend build completed."

      # 9. Build Windows application
      - name: Build Windows Application
        shell: pwsh
        run: |
          npx tauri build --ci

      # 10. Locate generated installer
      - name: Verify Windows Installer
        id: installer
        shell: pwsh
        run: |
          $installerDirs = @(
            "src-tauri/target/release/bundle/nsis",
            "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          )

          $installers = @(
            foreach ($dir in $installerDirs) {
              if (Test-Path $dir) {
                Get-ChildItem -Path $dir -Filter "*.exe" -File
              }
            }
          )

          $installers = @(
            $installers |
              Sort-Object FullName -Unique
          )

          if ($installers.Count -eq 0) {
            throw "No NSIS installer was generated. Check the Tauri bundle configuration."
          }

          foreach ($installer in $installers) {
            Write-Host "Found installer: $($installer.FullName)"
          }

      # 11. Upload Windows installer
      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Om-LifeOS-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      # 12. Publish tagged releases
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
